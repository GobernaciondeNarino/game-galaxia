# Claude Code en pull requests e issues — anthropics/claude-code-action
# Se dispara cuando alguien menciona @claude en un comentario, una issue o una
# revisión. Requiere el secreto ANTHROPIC_API_KEY en el repositorio.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Ejecutar Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --system-prompt "Este es ORBIS, una interfaz web del Sistema Solar sin paso de compilación (HTML + ES Modules + PHP) desplegada en Plesk. Responde y comenta en español. No introduzcas dependencias de npm en tiempo de ejecución ni claves de API en el código del cliente."

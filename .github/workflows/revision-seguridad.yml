# Revisión de seguridad con IA — anthropics/claude-code-security-review
#
# Aviso del propio proyecto: esta acción no está endurecida frente a inyección
# de prompts, así que solo debe ejecutarse sobre PR de confianza. En la
# configuración del repositorio conviene activar «Require approval for all
# external contributors» para que no corra en PR de forks sin revisar.
name: Revisión de seguridad

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  seguridad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Analizar los cambios
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
          upload-results: true
          # vendor/ son copias íntegras de Three.js y MediaPipe, y
          # .claude/skills contiene datos de una skill de terceros: analizarlos
          # solo genera ruido.
          exclude-directories: 'vendor,.claude,assets/fonts'
          custom-security-scan-instructions: '.github/instrucciones-seguridad.txt'
